<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14111c">
<title>Aura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --h:265;
  --ink:#14111c;
  --plum:#1d1928;
  --plum2:#272134;
  --bone:#f4efe8;
  --mute:#a39cb4;
  --acc:hsl(var(--h) 90% 68%);
  --acc2:hsl(calc(var(--h) + 40) 85% 60%);
  --line:rgba(255,255,255,.08);
  --display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --pad:clamp(16px,3vw,36px);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--ink);color:var(--bone);font:400 15px/1.45 var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,.card:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg{width:1em;height:1em;display:block}
.ic svg{width:100%;height:100%}
#app{height:100%;display:grid;grid-template-columns:248px 1fr;grid-template-rows:1fr 92px}
aside.side{grid-row:1;grid-column:1;background:var(--plum);padding:22px 14px;display:flex;flex-direction:column;gap:6px;overflow-y:auto;border-right:1px solid var(--line)}
.logo{font:800 28px/1 var(--display);padding:4px 12px 20px;display:flex;align-items:center;gap:10px;letter-spacing:-.02em}
.logo i{width:26px;height:26px;border-radius:50%;background:conic-gradient(from 200deg,var(--acc),var(--acc2),var(--acc));box-shadow:0 0 22px hsl(var(--h) 90% 60%/.55);transition:background .6s}
.nav{display:flex;align-items:center;gap:14px;padding:11px 12px;border-radius:10px;color:var(--mute);font-weight:500;width:100%;text-align:left;transition:color .15s,background .15s}
.nav .ic{width:22px;height:22px}
.nav:hover{color:var(--bone)}
.nav.on{color:var(--bone);background:var(--plum2)}
.side h4{font:500 13px var(--body);color:var(--mute);padding:18px 12px 6px}
.plink{padding:8px 12px;border-radius:8px;color:var(--mute);text-align:left;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plink:hover{color:var(--bone);background:var(--plum2)}
main{grid-row:1;grid-column:2;overflow-y:auto;position:relative;background:radial-gradient(1100px 520px at 15% -8%,hsl(var(--h) 55% 24%/.8),transparent 70%),var(--ink);transition:background .8s;scroll-behavior:smooth}
.page{padding:var(--pad);padding-bottom:40px;max-width:1500px}
h1{font:800 clamp(34px,5vw,58px)/1 var(--display);letter-spacing:-.03em}
h2{font:800 24px/1.1 var(--display);letter-spacing:-.02em}
.sub{color:var(--mute);margin-top:8px;max-width:60ch}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 6px}
.chip{padding:8px 16px;border-radius:99px;background:rgba(255,255,255,.07);font-weight:500;transition:background .15s,transform .15s}
.chip:hover{background:hsl(var(--h) 70% 45%/.55)}
.chip:active{transform:scale(.96)}
.shelf{margin-top:34px}
.shelf-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.link{color:var(--mute);font-weight:600;font-size:14px;padding:4px 8px;border-radius:8px}
.link:hover{color:var(--bone);background:rgba(255,255,255,.07)}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(158px,184px);gap:18px;overflow-x:auto;padding-bottom:8px;scrollbar-width:thin;scroll-snap-type:x proximity}
.card{scroll-snap-align:start;cursor:pointer;position:relative;padding:10px;margin:-10px;border-radius:16px;transition:background .15s}
.card:hover{background:rgba(255,255,255,.05)}
.cover{aspect-ratio:1;border-radius:14px;position:relative;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.35);background-size:cover;background-position:center}
.pbtn{position:absolute;right:10px;bottom:10px;width:46px;height:46px;border-radius:50%;background:var(--acc);color:#14101c;display:grid;place-items:center;padding:12px;opacity:0;transform:translateY(8px);transition:opacity .18s,transform .18s}
.card:hover .pbtn,.card:focus-visible .pbtn{opacity:1;transform:none}
.card h3{font:600 15px/1.25 var(--body);margin-top:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card p{color:var(--mute);font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card p.why{color:hsl(var(--h) 80% 76%);font-size:12.5px;margin-top:2px;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.sk{aspect-ratio:1;border-radius:14px;background:linear-gradient(100deg,var(--plum) 30%,var(--plum2) 50%,var(--plum) 70%);background-size:300% 100%;animation:sh 1.4s infinite linear}
@keyframes sh{to{background-position:-100% 0}}
.err{color:var(--mute);padding:20px;background:var(--plum);border-radius:14px;grid-column:1/-1}
.rows{display:flex;flex-direction:column;margin-top:14px}
.row{display:grid;grid-template-columns:30px 46px minmax(0,1fr) minmax(0,160px) 36px 48px 36px;align-items:center;gap:12px;padding:7px 10px;border-radius:10px;cursor:pointer}
.row:hover{background:rgba(255,255,255,.06)}
.row.on{background:hsl(var(--h) 50% 30%/.35)}
.row.on .meta b{color:var(--acc)}
.row .n{color:var(--mute);text-align:center;font-variant-numeric:tabular-nums}
.mini{width:46px;height:46px;border-radius:8px;background-size:cover;background-position:center}
.meta{min-width:0;display:flex;flex-direction:column}
.meta b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta span{color:var(--mute);font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .g{color:var(--mute);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .d{color:var(--mute);font-variant-numeric:tabular-nums;text-align:right;font-size:13.5px}
.ib{width:34px;height:34px;padding:7px;border-radius:50%;color:var(--mute);transition:color .15s,transform .15s,background .15s}
.ib:hover{color:var(--bone);background:rgba(255,255,255,.08)}
.ib.lk{color:var(--acc)}
.ib.lk:active{transform:scale(1.25)}
.searchbox{display:flex;align-items:center;gap:12px;background:var(--plum2);border-radius:99px;padding:6px 18px;max-width:560px;border:1px solid var(--line)}
.searchbox .ic{width:20px;height:20px;color:var(--mute)}
.searchbox input{flex:1;background:none;border:0;color:var(--bone);font:500 16px var(--body);padding:10px 0;outline:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;margin-top:20px}
.tile{height:96px;border-radius:14px;padding:14px;text-align:left;font:800 19px/1.1 var(--display);position:relative;overflow:hidden;transition:transform .15s}
.tile:hover{transform:translateY(-3px)}
.tile::after{content:"";position:absolute;right:-18px;bottom:-18px;width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,.16)}
.cta{background:var(--acc);color:#14101c;font-weight:700;padding:12px 26px;border-radius:99px;transition:transform .15s,filter .15s}
.cta:hover{transform:scale(1.04);filter:brightness(1.08)}
.ghost{padding:11px 22px;border-radius:99px;border:1px solid var(--line);font-weight:600}
.ghost:hover{background:rgba(255,255,255,.07)}
.head{display:flex;gap:26px;align-items:flex-end;flex-wrap:wrap}
.head .cover{width:min(220px,42vw);flex:none}
.bars{margin-top:18px;display:flex;flex-direction:column;gap:12px;max-width:640px}
.bar{display:grid;grid-template-columns:130px 1fr 44px;gap:12px;align-items:center;font-weight:500}
.bar i{height:12px;border-radius:99px;background:linear-gradient(90deg,var(--acc),var(--acc2));display:block;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.bar div{background:var(--plum2);border-radius:99px;overflow:hidden}
.bar em{color:var(--mute);font-style:normal;text-align:right;font-variant-numeric:tabular-nums}
.stats{display:flex;gap:14px;flex-wrap:wrap;margin-top:24px}
.stat{background:var(--plum);border-radius:16px;padding:18px 22px;min-width:150px}
.stat b{font:800 34px/1 var(--display);display:block;letter-spacing:-.02em}
.stat span{color:var(--mute);font-size:13.5px}
.empty{background:var(--plum);border-radius:18px;padding:34px;margin-top:22px;max-width:560px}
.empty p{color:var(--mute);margin:8px 0 18px}

/* player */
.player{grid-row:2;grid-column:1/-1;background:rgba(29,25,40,.92);backdrop-filter:blur(18px);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr minmax(320px,640px) 1fr;align-items:center;gap:18px;padding:0 20px;z-index:5}
body:not(.has) .player{opacity:.55;pointer-events:none}
.pl{display:flex;align-items:center;gap:14px;min-width:0}
.pl .mini{width:58px;height:58px;border-radius:10px;flex:none;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.4)}
.pl .meta{cursor:pointer}
.pc{display:flex;flex-direction:column;align-items:center;gap:4px}
.ctrls{display:flex;align-items:center;gap:10px}
.ctrls .ib{width:38px;height:38px;padding:9px}
.ctrls .ib.on{color:var(--acc)}
.ppbtn{width:46px!important;height:46px!important;padding:12px!important;background:var(--bone);color:var(--ink)!important;border-radius:50%}
.ppbtn:hover{transform:scale(1.06);background:#fff!important}
.seekrow{display:flex;align-items:center;gap:10px;width:100%;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.seekrow span{width:38px}
.seekrow span:first-child{text-align:right}
input[type=range]{-webkit-appearance:none;appearance:none;background:none;width:100%;height:18px;cursor:pointer;--p:0%}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:9px;background:linear-gradient(90deg,var(--acc) var(--p),rgba(255,255,255,.16) var(--p))}
input[type=range]::-moz-range-track{height:5px;border-radius:9px;background:linear-gradient(90deg,var(--acc) var(--p),rgba(255,255,255,.16) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--bone);margin-top:-4px;opacity:0;transition:opacity .15s}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border:0;border-radius:50%;background:var(--bone);opacity:0}
input[type=range]:hover::-webkit-slider-thumb,input[type=range]:focus-visible::-webkit-slider-thumb{opacity:1}
input[type=range]:hover::-moz-range-thumb{opacity:1}
.pr{display:flex;align-items:center;justify-content:flex-end;gap:6px}
.pr input{width:96px}
.pr .ic{width:20px;height:20px;color:var(--mute)}

/* now playing */
#np{position:fixed;inset:0;z-index:20;background:var(--ink);transform:translateY(100%);transition:transform .45s cubic-bezier(.2,.8,.2,1);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(20px,5vw,80px);padding:clamp(18px,4vw,56px);overflow:auto;align-items:center}
#np.open{transform:none}
#npBg{position:absolute;inset:0;z-index:-1;background-size:cover;background-position:center;filter:blur(70px) saturate(1.4);opacity:.55;transform:scale(1.3)}
#np::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(20,17,28,.2),var(--ink) 95%)}
#npClose{position:absolute;top:18px;left:18px;width:44px;height:44px;padding:10px}
#nArt{width:min(100%,520px,62vh);aspect-ratio:1;border-radius:22px;justify-self:center;box-shadow:0 40px 90px rgba(0,0,0,.6);background-size:cover;background-position:center}
.nr{display:flex;flex-direction:column;gap:14px;min-width:0}
.nr h1{font-size:clamp(30px,4.4vw,54px);overflow-wrap:anywhere}
.nr .by{font-size:19px;color:var(--mute)}
.whybox{background:hsl(var(--h) 45% 25%/.5);border-radius:14px;padding:12px 16px;color:hsl(var(--h) 85% 82%);font-weight:500;align-self:flex-start}
.upnext{max-height:26vh;overflow:auto;margin-top:6px}

#qp{position:fixed;top:0;right:0;bottom:92px;width:min(380px,100%);background:var(--plum);z-index:10;transform:translateX(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);padding:18px;overflow:auto;border-left:1px solid var(--line)}
#qp.open{transform:none}
#qp .row{grid-template-columns:46px minmax(0,1fr) 44px}
#qp h2{margin:4px 0 10px;font-size:20px}

#sheet{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center}
#sheet.open{display:flex}
.sheet-in{background:var(--plum2);width:min(460px,100%);border-radius:22px 22px 0 0;padding:22px;max-height:80vh;overflow:auto;animation:up .25s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet-in h3{font:800 20px var(--display);margin-bottom:4px}
.sheet-in .by{color:var(--mute);margin-bottom:14px}
.act{display:block;width:100%;text-align:left;padding:13px 10px;border-radius:10px;font-weight:500}
.act:hover{background:rgba(255,255,255,.07)}
.sheet-in input{width:100%;background:var(--plum);border:1px solid var(--line);color:var(--bone);border-radius:10px;padding:11px 14px;font:inherit;margin:8px 0}
.sep{height:1px;background:var(--line);margin:8px 0}
#ytWrap{position:fixed;left:16px;bottom:108px;width:200px;height:200px;border-radius:14px;overflow:hidden;z-index:25;box-shadow:0 14px 40px rgba(0,0,0,.6);visibility:hidden;opacity:0;transition:opacity .3s;background:#000}
#ytWrap.on{visibility:visible;opacity:1}
#ytWrap iframe{width:100%;height:100%;display:block}
.banner{background:var(--plum2);border-radius:14px;padding:12px 16px;margin-top:22px;color:var(--mute);max-width:640px}
.sh{margin-top:28px}
#toast{position:fixed;left:50%;bottom:110px;transform:translate(-50%,20px);background:var(--bone);color:var(--ink);padding:11px 20px;border-radius:99px;font-weight:600;opacity:0;pointer-events:none;transition:.3s;z-index:40;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.tabs{display:none}

@media (max-width:860px){
  #app{grid-template-columns:1fr;grid-template-rows:1fr auto 60px}
  aside.side{display:none}
  main{grid-column:1}
  .player{grid-row:2;grid-template-columns:1fr auto;height:70px;padding:0 12px;gap:8px}
  .pc{display:contents}
  .pc .seekrow,.pr,.ctrls .hide-m{display:none}
  .pl .mini{width:46px;height:46px}
  .player .ctrls{grid-column:2}
  .tabs{display:flex;grid-row:3;background:var(--plum);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  .tabs .nav{flex-direction:column;gap:2px;font-size:11px;justify-content:center;padding:6px;text-align:center;border-radius:0;background:none}
  .tabs .nav .ic{width:22px;height:22px}
  .row{grid-template-columns:26px 44px minmax(0,1fr) 34px 36px}
  .row .g,.row .d{display:none}
  #np{grid-template-columns:1fr;padding-top:70px;align-content:start}
  #qp{bottom:130px}
  #toast{bottom:150px}
  #ytWrap{bottom:150px;left:8px}
  .bar{grid-template-columns:96px 1fr 40px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="app">
  <aside class="side">
    <div class="logo"><i></i>Aura</div>
    <button class="nav" data-go="#/home"><span class="ic" data-i="home"></span>Home</button>
    <button class="nav" data-go="#/search"><span class="ic" data-i="search"></span>Search</button>
    <button class="nav" data-go="#/library"><span class="ic" data-i="library"></span>Your library</button>
    <button class="nav" data-go="#/insights"><span class="ic" data-i="insights"></span>Your sound</button>
    <button class="nav" data-yt><span class="ic" data-i="vol"></span>Full songs</button>
    <h4>Playlists</h4>
    <div id="sidePls"></div>
  </aside>
  <main id="main" tabindex="-1"></main>
  <footer class="player">
    <div class="pl">
      <div class="mini" id="pArt" data-open="np"></div>
      <div class="meta" data-open="np"><b id="pTitle">Nothing playing</b><span id="pArtist">Pick something to start</span></div>
      <button class="ib hide-m likeBtn" aria-label="Like"></button>
    </div>
    <div class="pc">
      <div class="ctrls">
        <button class="ib hide-m ic" id="bShuf" aria-label="Shuffle" data-i="shuffle"></button>
        <button class="ib ic hide-m" id="bPrev" aria-label="Previous" data-i="prev"></button>
        <button class="ib ic ppbtn" aria-label="Play or pause" data-pp></button>
        <button class="ib ic" id="bNext" aria-label="Next" data-i="next"></button>
        <button class="ib hide-m ic" id="bRep" aria-label="Repeat" data-i="repeat"></button>
      </div>
      <div class="seekrow"><span class="tcur">0:00</span><input class="seek" type="range" min="0" max="1000" value="0" aria-label="Seek"><span class="tdur">0:00</span></div>
    </div>
    <div class="pr">
      <button class="ib ic" id="bQueue" aria-label="Queue" data-i="queue"></button>
      <span class="ic" data-i="vol"></span><input class="vol" type="range" min="0" max="100" value="80" aria-label="Volume">
      <button class="ib ic" data-open="np" aria-label="Open now playing" data-i="expand"></button>
    </div>
  </footer>
  <nav class="tabs">
    <button class="nav" data-go="#/home" style="flex:1"><span class="ic" data-i="home"></span>Home</button>
    <button class="nav" data-go="#/search" style="flex:1"><span class="ic" data-i="search"></span>Search</button>
    <button class="nav" data-go="#/library" style="flex:1"><span class="ic" data-i="library"></span>Library</button>
    <button class="nav" data-go="#/insights" style="flex:1"><span class="ic" data-i="insights"></span>Sound</button>
  </nav>
</div>

<section id="np" aria-label="Now playing">
  <div id="npBg"></div>
  <button class="ib ic" id="npClose" aria-label="Close" data-i="down"></button>
  <div id="nArt"></div>
  <div class="nr">
    <h1 id="nTitle"></h1>
    <div class="by" id="nArtist"></div>
    <div class="whybox" id="nWhy" hidden></div>
    <div class="seekrow"><span class="tcur">0:00</span><input class="seek" type="range" min="0" max="1000" value="0" aria-label="Seek"><span class="tdur">0:00</span></div>
    <div class="ctrls">
      <button class="ib ic" id="bShuf2" aria-label="Shuffle" data-i="shuffle"></button>
      <button class="ib ic" id="bPrev2" aria-label="Previous" data-i="prev"></button>
      <button class="ib ic ppbtn" aria-label="Play or pause" data-pp></button>
      <button class="ib ic" id="bNext2" aria-label="Next" data-i="next"></button>
      <button class="ib ic" id="bRep2" aria-label="Repeat" data-i="repeat"></button>
      <button class="ib likeBtn" aria-label="Like"></button>
    </div>
    <div class="upnext" id="upnext"></div>
  </div>
</section>

<aside id="qp" aria-label="Queue"></aside>
<div id="sheet"><div class="sheet-in" id="sheetIn"></div></div>
<div id="toast" role="status"></div>
<audio id="audio" preload="auto"></audio>
<div id="ytWrap"><div id="ytp"></div></div>

<script>
'use strict';
/* ---------- config ---------- */
const API='https://api.audius.co/v1', APP='aura_player';
const GENRES=['Electronic','Hip-Hop/Rap','Pop','Lo-Fi','Ambient','Rock','Jazz','R&B/Soul','Latin','House','Techno','Trap','Alternative','Acoustic','Folk','Funk','Reggae','Classical','Country','Metal'];
const MOODS=[['Chill','Lo-Fi'],['Focus','Ambient'],['Party','House'],['Hype','Trap'],['Late night','R&B/Soul'],['Loud','Rock']];
const DEFAULTS=['Electronic','Hip-Hop/Rap','Pop'];

/* ---------- helpers ---------- */
const $=(s,e=document)=>e.querySelector(s), $$=(s,e=document)=>[...e.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=s=>{s=Math.max(0,Math.floor(s||0));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const hue=str=>{let h=0;for(const c of String(str))h=(h*31+c.charCodeAt(0))%360;return h};
const root=document.documentElement;
const store={get(k,d){try{const v=localStorage.getItem('aura:'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('aura:'+k,JSON.stringify(v))}catch(e){}}};
const I={
 play:'<svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z" fill="currentColor"/></svg>',
 pause:'<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z" fill="currentColor"/></svg>',

const cache=new Map();
async function api(path){

function jsonp(url){return new Promise((res,rej)=>{const cb='_j'+Date.now()+Math.floor(Math.random()*1e4);const sc=document.createElement('script');window[cb]=d=>{res(d);sc.remove();delete window[cb]};sc.onerror=()=>{rej(new Error('jsonp'));sc.remove()};sc.src=url+'&callback='+cb;document.head.appendChild(sc)})}
const normI=x=>{

async function itunes(q,limit=30){
  const url='https://itunes.apple.com/search?media=music&entity=song&limit='+limit+'&country='+COUNTRY+'&term='+encodeURIComponent(q);
  let j;try{const r=await fetch(url);if(!r.ok)throw new Error('http');j=await r.json()}catch(e){j=await jsonp(url)}

/* ---------- taste + recommendations ---------- */
function bump(t,w){
  const T=S.taste;
  T.genres[t.genre]=(T.genres[t.genre]||0)+w;
  T.artists[t.artist]=(T.artists[t.artist]||0)+w;
  if(t.mood)T.moods[t.mood]=(T.moods[t.mood]||0)+w;
  if(++S.events%25===0)for(const k of ['genres','artists','moods'])for(const x in T[k])T[k][x]*=.9;
}
const topKeys=(o,n)=>Object.entries(o).filter(e=>e[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,n).map(e=>e[0]);
const hasTaste=()=>topKeys(S.taste.genres,1).length>0;

async function recommend(){
  const T=S.taste,tg=topKeys(T.genres,3),ta=topKeys(T.artists,2);
  const base=tg.length?tg:DEFAULTS;
  const unexplored=GENRES.filter(g=>!(T.genres[g]>0));
  const wild=unexplored[Math.floor(Math.random()*unexplored.length)];
  const jobs=[
    ...base.map(g=>trending(g,30).catch(()=>[])),
    ...ta.map(a=>search(a,15).catch(()=>[])),
    wild?trending(wild,12).catch(()=>[]):Promise.resolve([])
  ];
  const res=await Promise.all(jobs);
  const wildSet=new Set((res[res.length-1]||[]).map(t=>t.id));
  const seen=new Set(S.seen.slice(-200)),uniq=new Map();
  const gmax=Math.max(1,...Object.values(T.genres)),amax=Math.max(1,...Object.values(T.artists));
  for(const t of res.flat()){
    if(seen.has(t.id)||uniq.has(t.id))continue;
    const gw=(T.genres[t.genre]||0)/gmax,aw=(T.artists[t.artist]||0)/amax;
    if(aw<-.3||gw<-.5)continue;
    let score=2*gw+3*aw+.4*Math.min(1,Math.log10(t.plays+1)/6)+Math.random()*.5;
    let why;
    if(!hasTaste())why='Trending in '+t.genre;
    else if(aw>.3)why='Because you like '+t.artist;
    else if(wildSet.has(t.id)){why='Something new: '+t.genre;score+=.3}
    else if(gw>.3)why='Matches your '+t.genre+' taste';
    else why='Fresh in '+t.genre;
    uniq.set(t.id,{t,score,why});
  }
  const per={},out=[];
  for(const x of [...uniq.values()].sort((a,b)=>b.score-a.score)){
    per[x.t.artist]=(per[x.t.artist]||0)+1;
    if(per[x.t.artist]>2)continue;
    out.push(Object.assign(x.t,{why:x.why}));
    if(out.length>=30)break;
  }
  return out;
}

      yt=new YT.Player('ytp',{width:200,height:200,playerVars:{playsinline:1,controls:1,rel:0,fs:0},events:{

const ytCache=new Map();
async function ytResolve(t){
  if(ytCache.has(t.id))return ytCache.get(t.id);
  const r=await fetch('https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoEmbeddable=true&videoCategoryId=10&maxResults=1&q='+encodeURIComponent(t.artist+' '+t.title+' audio')+'&key='+encodeURIComponent(ytKey()));
  if(!r.ok)throw new Error('yt '+r.status);
  const j=await r.json(),v=(j.items&&j.items[0]&&j.items[0].id&&j.items[0].id.videoId)||null;
  ytCache.set(t.id,v);return v;
}
function logEnd(){
  if(!cur||!started)return;
  const c=curTime()||0,dur=curDur()||cur.dur||1,pct=Math.min(1,c/dur);
  const w=pct>.8?3:pct>.4?1:pct<.15?-1.5:0;
  S.stats.sec+=c;
  if(pct<.15)S.stats.skips++;
  if(w)bump(cur,w);
  started=false;save();
}
function play(list,i){
  if(!list||!list[i])return;
  logEnd();Q=list.slice();qi=i;load();
}
async function load(){
  const t=cur=Q[qi];if(!t)return;
  started=true;counted=false;updateUI();
  stopYT();au.pause();
  if(t.src==='itunes'&&ytKey()){
    try{
      const vid=await ytResolve(t);
      if(cur!==t)return;
      if(vid){
        await ytInit();if(cur!==t)return;
        eng='yt';$('#ytWrap').classList.add('on');
        yt.loadVideoById(vid);yt.setVolume(au.volume*100);
        clearInterval(ytTimer);ytTimer=setInterval(tick,300);playState();return;
      }
    }catch(e){if(!ytWarned){ytWarned=true;toast('YouTube lookup failed. Playing the 30s preview.')}}
  }
  if(cur!==t)return;
  eng='au';
  au.src=t.src==='itunes'?t.url:API+'/tracks/'+t.id+'/stream?app_name='+APP;
  const p=au.play();if(p&&p.catch)p.catch(()=>{});
  if(t.src==='itunes'&&!ytKey()&&!ytWarned){ytWarned=true;toast('30s preview. Add a YouTube key to hear full songs.')}
}
async function extendQueue(){
  try{
    const recs=(await recommend()).filter(t=>!Q.some(q=>q.id===t.id)).slice(0,15);
    if(recs.length){Q.push(...recs);toast('Autoplay: picked more for you');renderQueue()}
  }catch(e){}
}
async function next(auto){
  if(!Q.length)return;
  logEnd();
  if(auto&&rep===2){seekTo(0);started=true;if(eng==='yt'&&ytReady)yt.playVideo();else au.play();return}
  if(shuffle&&Q.length>1){let n;do{n=Math.floor(Math.random()*Q.length)}while(n===qi);qi=n}
  else qi++;
  if(qi>=Q.length){
    if(rep===1)qi=0;
    else{await extendQueue();if(qi>=Q.length){qi=Q.length-1;pauseAll();return}}
  }
  load();
}
function prev(){
  if(!Q.length)return;
  if((curTime()||0)>4){seekTo(0);return}
  logEnd();qi=Math.max(0,qi-1);load();
}
const toggle=()=>{
  if(!cur)return;

  else au.paused?au.play():au.pause();
};
function tick(){
  const d=curDur(),c=curTime()||0;
  $$('.seek').forEach(x=>{if(!x._drag){x.value=d?c/d*1000:0;setP(x)}});
  $$('.tcur').forEach(e=>e.textContent=fmt(c));

  if(!counted&&c>10&&cur){
    counted=true;S.stats.plays++;
    S.recent=[cur,...S.recent.filter(t=>t.id!==cur.id)].slice(0,30);
    S.seen.push(cur.id);if(S.seen.length>300)S.seen.shift();
    save();
  }
}

   shelf('Made for you','recs','<button class="link" id="playRecs">Play all</button>')+
   (S.recent.length?'<section class="shelf"><div class="shelf-h"><h2>Jump back in</h2></div><div class="rail" id="recent"></div></section>':'')+
   (tg[0]?shelf('More '+tg[0],'mix1'):'')+(tg[1]?shelf('More '+tg[1],'mix2'):'')+
   shelf('Trending now','trend')+
   '<section class="shelf"><div class="shelf-h"><h2>Browse genres</h2></div><div class="tiles">'+tiles(GENRES.slice(0,12))+'</div></section></div>';
  const rp=fill('recs',recommend());
  $('#playRecs').onclick=()=>LISTS.recs&&LISTS.recs.length&&play(LISTS.recs,0);
  if(S.recent.length){LISTS.recent=S.recent;$('#recent').innerHTML=S.recent.map((t,i)=>card(t,'recent',i)).join('')}
  if(tg[0])fill('mix1',trending(tg[0],24,'month'));
  if(tg[1])fill('mix2',trending(tg[1],24,'month'));
  fill('trend',trending('',24,'week'));
}
const tiles=gs=>gs.map(g=>'<button class="tile" data-go="#/genre/'+encodeURIComponent(g)+'" style="background:linear-gradient(135deg,hsl('+hue(g)+' 65% 42%),hsl('+((hue(g)+50)%360)+' 60% 28%))">'+esc(g)+'</button>').join('');

let searchT;
function searchView(){
  main.innerHTML='<div class="page"><div class="searchbox"><span class="ic" data-i="search"></span><input id="q" type="search" placeholder="Songs, artists, vibes" autocomplete="off" aria-label="Search"></div><div id="sres"><h2 style="margin-top:30px">Browse all</h2><div class="tiles">'+tiles(GENRES)+'</div></div></div>';
  icons(main);
  const q=$('#q');q.focus();
  q.addEventListener('input',()=>{
    clearTimeout(searchT);
    const v=q.value.trim();
    if(!v){searchView();return}
    searchT=setTimeout(async()=>{
      const box=$('#sres');if(!box)return;
      box.innerHTML='<div class="rail" style="margin-top:24px">'+skel(5)+'</div>';
      try{
        const [a,b]=await Promise.allSettled([itunes(v,30),search(v,20)]);
        if(a.status==='rejected'&&b.status==='rejected')throw new Error('both failed');
        const A=a.status==='fulfilled'?a.value:[],B=b.status==='fulfilled'?b.value:[],all=A.concat(B);
        LISTS.sres=all;
        if(!all.length){box.innerHTML='<div class="empty"><h2>No results for \u201c'+esc(v)+'\u201d</h2><p>Try a different spelling, an artist name, or a genre.</p></div>';return}
        box.innerHTML=(A.length&&!ytKey()?'<div class="banner">Catalog songs play a 30 second preview. <button class="link" data-yt>Unlock full songs</button></div>':'')+
          (A.length?'<h2 class="sh">Songs</h2><div class="rows">'+A.map((t,i)=>row(t,'sres',i)).join('')+'</div>':'')+
          (B.length?'<h2 class="sh">Independent artists, full length</h2><div class="rows">'+B.map((t,i)=>row(t,'sres',A.length+i)).join('')+'</div>':'');
      }catch(e){box.innerHTML='<div class="err" style="margin-top:20px">Search failed. Check your connection and try again.</div>'}
    },350);
  });
}
async function genreView(g){
  main.innerHTML='<div class="page"><h1>'+esc(g)+'</h1><p class="sub">This week\u2019s most played.</p><div style="margin-top:18px"><button class="cta" id="gPlay">Play</button></div><div id="gl" class="rows">'+skel(1)+'</div></div>';
  try{
    const r=await trending(g,40);LISTS.gl=r;
    $('#gl').innerHTML=r.map((t,i)=>row(t,'gl',i)).join('')||'<div class="err">No tracks found.</div>';
    $('#gPlay').onclick=()=>r.length&&play(r,0);
  }catch(e){$('#gl').innerHTML='<div class="err">Couldn\u2019t load this genre. Try again.</div>'}
}
function plCover(p){return p.tracks[0]?bg(p.tracks[0]):'background:linear-gradient(135deg,hsl('+hue(p.name)+' 60% 40%),hsl('+((hue(p.name)+60)%360)+' 60% 24%))'}
function library(){
  const likedCover=S.likes[0]?bg(S.likes[0]):'background:linear-gradient(135deg,#7b5cff,#ff7ab8)';
  main.innerHTML='<div class="page"><h1>Your library</h1><div class="shelf"><div class="rail" style="grid-auto-columns:minmax(158px,184px)">'+
   '<article class="card" tabindex="0" data-go="#/liked"><div class="cover" style="'+likedCover+'"></div><h3>Liked songs</h3><p>'+S.likes.length+' songs</p></article>'+
   S.pls.map(p=>'<article class="card" tabindex="0" data-go="#/playlist/'+p.id+'"><div class="cover" style="'+plCover(p)+'"></div><h3>'+esc(p.name)+'</h3><p>'+p.tracks.length+' songs</p></article>').join('')+
   '</div></div><div style="margin-top:20px"><button class="ghost" id="newPl">New playlist</button></div></div>';
  $('#newPl').onclick=()=>openSheet(sheetNewPl(null));
}
function likedView(){
  LISTS.liked=S.likes;
  main.innerHTML='<div class="page"><h1>Liked songs</h1><p class="sub">'+S.likes.length+' songs. Likes teach Aura your taste faster than anything else.</p>'+
   (S.likes.length?'<div style="margin-top:18px"><button class="cta" id="lp">Play</button></div><div class="rows">'+S.likes.map((t,i)=>row(t,'liked',i)).join('')+'</div>':'<div class="empty"><h2>No likes yet</h2><p>Tap the heart on any song to save it here.</p><button class="cta" data-go="#/home">Find music</button></div>')+'</div>';
  const b=$('#lp');if(b)b.onclick=()=>play(S.likes,0);
}
function playlistView(id){
  const p=S.pls.find(x=>x.id===id);
  if(!p){location.hash='#/library';return}
  LISTS.pl=p.tracks;
  main.innerHTML='<div class="page"><div class="head"><div class="cover" style="'+plCover(p)+'"></div><div><h1>'+esc(p.name)+'</h1><p class="sub">'+p.tracks.length+' songs</p></div></div><div style="margin-top:22px;display:flex;gap:10px"><button class="cta" id="pp">Play</button><button class="ghost" id="dp">Delete playlist</button></div>'+
   (p.tracks.length?'<div class="rows">'+p.tracks.map((t,i)=>row(t,'pl',i)).join('')+'</div>':'<div class="empty"><h2>Empty playlist</h2><p>Use the \u22ef menu on any song and choose this playlist.</p></div>')+'</div>';
  $('#pp').onclick=()=>p.tracks.length&&play(p.tracks,0);
  $('#dp').onclick=()=>{if(confirm('Delete \u201c'+p.name+'\u201d?')){S.pls=S.pls.filter(x=>x.id!==id);save();sidePls();location.hash='#/library'}};
}
function insights(){
  const T=S.taste,gs=Object.entries(T.genres).filter(e=>e[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const as=Object.entries(T.artists).filter(e=>e[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const mx=gs.length?gs[0][1]:1,tot=gs.reduce((s,e)=>s+e[1],0)||1;
  const skipRate=S.stats.plays+S.stats.skips?Math.round(S.stats.skips/(S.stats.plays+S.stats.skips)*100):0;
  main.innerHTML='<div class="page"><h1>Your sound</h1><p class="sub">Everything here is learned on this device. Full listens, likes and skips shape it. Nothing leaves your browser.</p>'+
   '<div class="stats"><div class="stat"><b>'+Math.round(S.stats.sec/60)+'</b><span>minutes listened</span></div><div class="stat"><b>'+S.stats.plays+'</b><span>songs played</span></div><div class="stat"><b>'+skipRate+'%</b><span>skip rate</span></div><div class="stat"><b>'+S.likes.length+'</b><span>liked songs</span></div></div>'+
   (gs.length?'<h2 style="margin-top:34px">Top genres</h2><div class="bars">'+gs.map(e=>'<div class="bar"><span>'+esc(e[0])+'</span><div><i style="width:'+Math.round(e[1]/mx*100)+'%"></i></div><em>'+Math.round(e[1]/tot*100)+'%</em></div>').join('')+'</div>'+
     '<h2 style="margin-top:34px">Artists you keep returning to</h2><div class="rows">'+as.map(e=>'<div class="row" style="grid-template-columns:minmax(0,1fr)"><div class="meta"><b>'+esc(e[0])+'</b></div></div>').join('')+'</div>'+
     '<div style="margin-top:28px"><button class="ghost" id="reset">Reset my taste</button></div>':
     '<div class="empty"><h2>Nothing to show yet</h2><p>Listen to a few songs all the way through, like the ones you love, and skip the rest.</p><button class="cta" data-go="#/home">Start listening</button></div>')+'</div>';
  const r=$('#reset');if(r)r.onclick=()=>{if(confirm('Clear everything Aura has learned?')){S.taste={genres:{},artists:{},moods:{}};S.stats={plays:0,sec:0,skips:0};S.seen=[];S.recent=[];save();insights()}};
}

/* ---------- sheet (track menu) ---------- */
const sheet=$('#sheet'),sheetIn=$('#sheetIn');
function openSheet(html){sheetIn.innerHTML=html;sheet.classList.add('open')}
const closeSheet=()=>sheet.classList.remove('open');
sheet.addEventListener('click',e=>{if(e.target===sheet)closeSheet()});
const sheetNewPl=t=>'<h3>New playlist</h3><input id="plName" placeholder="Playlist name" maxlength="60" aria-label="Playlist name"><button class="cta" data-act="mk" data-id="'+(t?esc(t.id):'')+'">Create</button>';
function menuFor(t){
  return '<h3>'+esc(t.title)+'</h3><div class="by">'+esc(t.artist)+'</div>'+
   '<button class="act" data-act="next" data-id="'+esc(t.id)+'">Play next</button>'+
   '<button class="act" data-act="queue" data-id="'+esc(t.id)+'">Add to queue</button>'+
   '<button class="act" data-act="like" data-id="'+esc(t.id)+'">'+(liked(t.id)?'Remove from liked songs':'Add to liked songs')+'</button>'+
   '<div class="sep"></div>'+
   S.pls.map(p=>'<button class="act" data-act="add" data-pl="'+p.id+'" data-id="'+esc(t.id)+'">Add to '+esc(p.name)+'</button>').join('')+
   '<button class="act" data-act="newpl" data-id="'+esc(t.id)+'">New playlist\u2026</button>';
}
const ytSheet=()=>'<h3>Play full songs</h3><div class="by">Catalog songs play 30 seconds by default. A free YouTube key lets Aura play the whole song in a small video window.</div><div style="color:var(--mute);font-size:14px;line-height:1.6;margin-bottom:8px">1. Open console.cloud.google.com and create a project.<br>2. Enable \u201cYouTube Data API v3\u201d.<br>3. Credentials, then Create API key. Restrict it to YouTube Data API v3 and to your site address.<br>4. Paste it below. It stays in this browser only.</div><input id="ytKey" placeholder="YouTube API key" value="'+esc(ytKey())+'" aria-label="YouTube API key"><button class="cta" data-act="ytsave">Save</button> '+(ytKey()?'<button class="ghost" data-act="ytclear">Remove key</button>':'')+'<div style="color:var(--mute);font-size:12.5px;margin-top:12px">The free quota covers about 100 song lookups a day. Playback uses YouTube\u2019s official player, so its video window and ads can appear.</div>';
sheet.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const t=TR.get(b.dataset.id),a=b.dataset.act;
  if(a==='next'&&t){if(!cur){play([t],0)}else{Q.splice(qi+1,0,t);renderQueue()}toast('Playing next');closeSheet()}
  else if(a==='queue'&&t){if(!cur){play([t],0)}else{Q.push(t);renderQueue()}toast('Added to queue');closeSheet()}
  else if(a==='like'){toggleLike(t);closeSheet()}
  else if(a==='add'){const p=S.pls.find(x=>x.id===b.dataset.pl);if(p&&!p.tracks.some(x=>x.id===t.id)){p.tracks.push(t);save();toast('Added to '+p.name)}else toast('Already in '+(p?p.name:'playlist'));closeSheet()}
  else if(a==='ytsave'){const k=$('#ytKey').value.trim();if(k){store.set('ytkey',k);ytWarned=false;toast('Full songs unlocked');closeSheet()}}
  else if(a==='ytclear'){store.set('ytkey','');stopYT();toast('Key removed');closeSheet()}
  else if(a==='newpl'){sheetIn.innerHTML=sheetNewPl(t);$('#plName').focus()}
  else if(a==='mk'){
    const n=$('#plName').value.trim();if(!n)return;
    const p={id:'p'+Date.now().toString(36),name:n,tracks:t?[t]:[]};S.pls.push(p);save();sidePls();closeSheet();toast('Created '+n);
    if(location.hash==='#/library')library();
  }
});

/* ---------- global events ---------- */
document.addEventListener('click',e=>{
  const lk=e.target.closest('[data-like]');
  if(lk){e.stopPropagation();toggleLike(TR.get(lk.dataset.like));return}
  const mn=e.target.closest('[data-menu]');
  if(mn){e.stopPropagation();const t=TR.get(mn.dataset.menu);if(t)openSheet(menuFor(t));return}
  if(e.target.closest('[data-yt]')){openSheet(ytSheet());return}
  if(e.target.closest('[data-open]')){openNP(true);return}
  const go=e.target.closest('[data-go]');
  if(go){const h=go.dataset.go;if(location.hash===h)route();else location.hash=h;$('#np').classList.remove('open');return}
  const pl=e.target.closest('[data-play]');
  if(pl){const s=pl.dataset.play,k=s.slice(0,s.lastIndexOf(':')),i=+s.slice(s.lastIndexOf(':')+1);if(k==='queue'){logEnd();qi=i;load()}else play(LISTS[k],i)}
});
document.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase();
  if(e.key==='Escape'){closeSheet();openNP(false);$('#qp').classList.remove('open');return}
  if(tag==='input'&&e.target.type!=='range')return;
  if(e.target.classList&&e.target.classList.contains('card')&&(e.key==='Enter')){e.target.click();return}
  if(e.code==='Space'&&tag!=='button'){e.preventDefault();toggle()}
  else if(e.key==='ArrowRight'&&e.shiftKey)next();
  else if(e.key==='ArrowLeft'&&e.shiftKey)prev();
  else if(e.key==='l'&&cur)toggleLike(cur);
});

/* ---------- router ---------- */
function sidePls(){$('#sidePls').innerHTML=S.pls.map(p=>'<button class="plink" data-go="#/playlist/'+p.id+'">'+esc(p.name)+'</button>').join('')||'<div class="plink" style="color:var(--mute);cursor:default">None yet</div>'}
function icons(el){$$('[data-i]',el).forEach(n=>{if(!n.innerHTML.trim())n.innerHTML=I[n.dataset.i]})}
function route(){
  const parts=location.hash.replace(/^#\/?/,'').split('/'),name=parts[0]||'home',arg=decodeURIComponent(parts[1]||'');
  $$('.nav').forEach(n=>n.classList.toggle('on',n.dataset.go==='#/'+(name==='genre'||name==='liked'||name==='playlist'?(name==='genre'?'search':'library'):name)));
  main.scrollTop=0;
  ({home,search:searchView,library,liked:likedView,insights}[name]||(()=>{
    if(name==='genre')genreView(arg);else if(name==='playlist')playlistView(arg);else home();
  }))(arg);
  icons(main);
  markRows();
}
window.addEventListener('hashchange',route);
icons(document);sidePls();playState();route();
</script>
</body>
