<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14111c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Aura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --h:265;
  color-scheme:dark;
  --ink:#14111c;
  --plum:#1d1928;
  --plum2:#272134;
  --bone:#f4efe8;
  --mute:#a39cb4;
  --acc:hsl(var(--h) 90% 68%);
  --acc2:hsl(calc(var(--h) + 40) 85% 60%);
  --line:rgba(255,255,255,.08);
  --display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --pad:clamp(16px,3vw,36px);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--ink);color:var(--bone);font:400 15px/1.45 var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,.card:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg{width:1em;height:1em;display:block}
.ic svg{width:100%;height:100%}
#app{height:100%;display:grid;grid-template-columns:248px 1fr;grid-template-rows:1fr 92px}
aside.side{grid-row:1;grid-column:1;background:var(--plum);padding:22px 14px;display:flex;flex-direction:column;gap:6px;overflow-y:auto;border-right:1px solid var(--line)}
.logo{font:800 28px/1 var(--display);padding:4px 12px 20px;display:flex;align-items:center;gap:10px;letter-spacing:-.02em}
.logo i{width:26px;height:26px;border-radius:50%;background:conic-gradient(from 200deg,var(--acc),var(--acc2),var(--acc));box-shadow:0 0 22px hsl(var(--h) 90% 60%/.55);transition:background .6s}
.nav{display:flex;align-items:center;gap:14px;padding:11px 12px;border-radius:10px;color:var(--mute);font-weight:500;width:100%;text-align:left;transition:color .15s,background .15s}
.nav .ic{width:22px;height:22px}
.nav:hover{color:var(--bone)}
.nav.on{color:var(--bone);background:var(--plum2)}
.side h4{font:500 13px var(--body);color:var(--mute);padding:18px 12px 6px}
.plink{padding:8px 12px;border-radius:8px;color:var(--mute);text-align:left;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plink:hover{color:var(--bone);background:var(--plum2)}
main{grid-row:1;grid-column:2;overflow-y:auto;position:relative;background:radial-gradient(1100px 520px at 15% -8%,hsl(var(--h) 55% 24%/.8),transparent 70%),var(--ink);transition:background .8s;scroll-behavior:smooth}
.page{padding:var(--pad);padding-bottom:40px;max-width:1500px}
h1{font:800 clamp(34px,5vw,58px)/1 var(--display);letter-spacing:-.03em}
h2{font:800 24px/1.1 var(--display);letter-spacing:-.02em}
.sub{color:var(--mute);margin-top:8px;max-width:60ch}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 6px}
.chip{padding:8px 16px;border-radius:99px;background:rgba(255,255,255,.07);font-weight:500;transition:background .15s,transform .15s}
.chip:hover{background:hsl(var(--h) 70% 45%/.55)}
.chip:active{transform:scale(.96)}
.shelf{margin-top:34px}
.shelf-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.link{color:var(--mute);font-weight:600;font-size:14px;padding:4px 8px;border-radius:8px}
.link:hover{color:var(--bone);background:rgba(255,255,255,.07)}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(158px,184px);gap:18px;overflow-x:auto;padding-bottom:8px;scrollbar-width:thin;scroll-snap-type:x proximity}
.card{scroll-snap-align:start;cursor:pointer;position:relative;padding:10px;margin:-10px;border-radius:16px;transition:background .15s}
.card:hover{background:rgba(255,255,255,.05)}
.cover{aspect-ratio:1;border-radius:14px;position:relative;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.35);background-size:cover;background-position:center}
.pbtn{position:absolute;right:10px;bottom:10px;width:46px;height:46px;border-radius:50%;background:var(--acc);color:#14101c;display:grid;place-items:center;padding:12px;opacity:0;transform:translateY(8px);transition:opacity .18s,transform .18s}
.card:hover .pbtn,.card:focus-visible .pbtn{opacity:1;transform:none}
.card h3{font:600 15px/1.25 var(--body);margin-top:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card p{color:var(--mute);font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card p.why{color:hsl(var(--h) 80% 76%);font-size:12.5px;margin-top:2px;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.sk{aspect-ratio:1;border-radius:14px;background:linear-gradient(100deg,var(--plum) 30%,var(--plum2) 50%,var(--plum) 70%);background-size:300% 100%;animation:sh 1.4s infinite linear}
@keyframes sh{to{background-position:-100% 0}}
.err{color:var(--mute);padding:20px;background:var(--plum);border-radius:14px;grid-column:1/-1}
.rows{display:flex;flex-direction:column;margin-top:14px}
.row{display:grid;grid-template-columns:30px 46px minmax(0,1fr) minmax(0,160px) 36px 48px 36px;align-items:center;gap:12px;padding:7px 10px;border-radius:10px;cursor:pointer}
.row:hover{background:rgba(255,255,255,.06)}
.row.on{background:hsl(var(--h) 50% 30%/.35)}
.row.on .meta b{color:var(--acc)}
.row .n{color:var(--mute);text-align:center;font-variant-numeric:tabular-nums}
.mini{width:46px;height:46px;border-radius:8px;background-size:cover;background-position:center}
.meta{min-width:0;display:flex;flex-direction:column}
.meta b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta span{color:var(--mute);font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .g{color:var(--mute);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .d{color:var(--mute);font-variant-numeric:tabular-nums;text-align:right;font-size:13.5px}
.ib{width:34px;height:34px;padding:7px;border-radius:50%;color:var(--mute);transition:color .15s,transform .15s,background .15s}
.ib:hover{color:var(--bone);background:rgba(255,255,255,.08)}
.ib.lk{color:var(--acc)}
.ib.lk:active{transform:scale(1.25)}
.searchbox{display:flex;align-items:center;gap:12px;background:var(--plum2);border-radius:99px;padding:6px 18px;max-width:560px;border:1px solid var(--line)}
.searchbox .ic{width:20px;height:20px;color:var(--mute)}
.searchbox input{flex:1;background:none;border:0;color:var(--bone);font:500 16px var(--body);padding:10px 0;outline:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;margin-top:20px}
.tile{height:96px;border-radius:14px;padding:14px;text-align:left;font:800 19px/1.1 var(--display);position:relative;overflow:hidden;transition:transform .15s}
.tile:hover{transform:translateY(-3px)}
.tile::after{content:"";position:absolute;right:-18px;bottom:-18px;width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,.16)}
.cta{background:var(--acc);color:#14101c;font-weight:700;padding:12px 26px;border-radius:99px;transition:transform .15s,filter .15s}
.cta:hover{transform:scale(1.04);filter:brightness(1.08)}
.ghost{padding:11px 22px;border-radius:99px;border:1px solid var(--line);font-weight:600}
.ghost:hover{background:rgba(255,255,255,.07)}
.head{display:flex;gap:26px;align-items:flex-end;flex-wrap:wrap}
.head .cover{width:min(220px,42vw);flex:none}
.bars{margin-top:18px;display:flex;flex-direction:column;gap:12px;max-width:640px}
.bar{display:grid;grid-template-columns:130px 1fr 44px;gap:12px;align-items:center;font-weight:500}
.bar i{height:12px;border-radius:99px;background:linear-gradient(90deg,var(--acc),var(--acc2));display:block;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.bar div{background:var(--plum2);border-radius:99px;overflow:hidden}
.bar em{color:var(--mute);font-style:normal;text-align:right;font-variant-numeric:tabular-nums}
.stats{display:flex;gap:14px;flex-wrap:wrap;margin-top:24px}
.stat{background:var(--plum);border-radius:16px;padding:18px 22px;min-width:150px}
.stat b{font:800 34px/1 var(--display);display:block;letter-spacing:-.02em}
.stat span{color:var(--mute);font-size:13.5px}
.empty{background:var(--plum);border-radius:18px;padding:34px;margin-top:22px;max-width:560px}
.empty p{color:var(--mute);margin:8px 0 18px}

/* player */
.player{grid-row:2;grid-column:1/-1;background:rgba(29,25,40,.92);backdrop-filter:blur(18px);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr minmax(320px,640px) 1fr;align-items:center;gap:18px;padding:0 20px;z-index:5}
body:not(.has) .player{opacity:.55;pointer-events:none}
.pl{display:flex;align-items:center;gap:14px;min-width:0}
.pl .mini{width:58px;height:58px;border-radius:10px;flex:none;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.4)}
.pl .meta{cursor:pointer}
.pc{display:flex;flex-direction:column;align-items:center;gap:4px}
.ctrls{display:flex;align-items:center;gap:10px}
.ctrls .ib{width:38px;height:38px;padding:9px}
.ctrls .ib.on{color:var(--acc)}
.ppbtn{width:46px!important;height:46px!important;padding:12px!important;background:var(--bone);color:var(--ink)!important;border-radius:50%}
.ppbtn:hover{transform:scale(1.06);background:#fff!important}
.seekrow{display:flex;align-items:center;gap:10px;width:100%;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.seekrow span{width:38px}
.seekrow span:first-child{text-align:right}
input[type=range]{-webkit-appearance:none;appearance:none;background:none;width:100%;height:18px;cursor:pointer;--p:0%}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:9px;background:linear-gradient(90deg,var(--acc) var(--p),rgba(255,255,255,.16) var(--p))}
input[type=range]::-moz-range-track{height:5px;border-radius:9px;background:linear-gradient(90deg,var(--acc) var(--p),rgba(255,255,255,.16) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--bone);margin-top:-4px;opacity:0;transition:opacity .15s}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border:0;border-radius:50%;background:var(--bone);opacity:0}
input[type=range]:hover::-webkit-slider-thumb,input[type=range]:focus-visible::-webkit-slider-thumb{opacity:1}
input[type=range]:hover::-moz-range-thumb{opacity:1}
.pr{display:flex;align-items:center;justify-content:flex-end;gap:6px}
.pr input{width:96px}
.pr span.ic{width:20px;height:20px;color:var(--mute)}

/* now playing */
#np{position:fixed;inset:0;z-index:20;background:var(--ink);transform:translateY(100%);transition:transform .45s cubic-bezier(.2,.8,.2,1);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(20px,5vw,80px);padding:clamp(18px,4vw,56px);overflow-y:auto;overflow-x:hidden;align-items:center}
#np.open{transform:none}
#npBg{position:absolute;inset:0;z-index:-1;background-size:cover;background-position:center;filter:blur(70px) saturate(1.4);opacity:.55;transform:scale(1.3)}
#np::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(20,17,28,.2),var(--ink) 95%)}
#npClose{position:absolute;top:18px;left:18px;width:44px;height:44px;padding:10px}
#nArt{width:min(100%,520px,62vh);aspect-ratio:1;border-radius:22px;justify-self:center;box-shadow:0 40px 90px rgba(0,0,0,.6);background-size:cover;background-position:center}
.nr{display:flex;flex-direction:column;gap:14px;min-width:0}
.nr h1{font-size:clamp(30px,4.4vw,54px);overflow-wrap:anywhere}
.nr .by{font-size:19px;color:var(--mute)}
.whybox{background:hsl(var(--h) 45% 25%/.5);border-radius:14px;padding:12px 16px;color:hsl(var(--h) 85% 82%);font-weight:500;align-self:flex-start}
.upnext{max-height:30vh;overflow:auto;margin-top:6px}
.upnext .row{grid-template-columns:46px minmax(0,1fr) 44px}
.upnext h2{font-size:18px;margin-top:6px}

#qp{position:fixed;top:0;right:0;bottom:92px;width:min(380px,100%);background:var(--plum);z-index:10;transform:translateX(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);padding:18px;overflow:auto;border-left:1px solid var(--line)}
#qp.open{transform:none}
#qp .row{grid-template-columns:46px minmax(0,1fr) 44px}
#qp h2{margin:4px 0 10px;font-size:20px}

#sheet{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center}
#sheet.open{display:flex}
.sheet-in{background:var(--plum2);width:min(460px,100%);border-radius:22px 22px 0 0;padding:22px;max-height:80vh;overflow:auto;animation:up .25s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet-in h3{font:800 20px var(--display);margin-bottom:4px}
.sheet-in .by{color:var(--mute);margin-bottom:14px}
.act{display:block;width:100%;text-align:left;padding:13px 10px;border-radius:10px;font-weight:500}
.act:hover{background:rgba(255,255,255,.07)}
.sheet-in input{width:100%;background:var(--plum);border:1px solid var(--line);color:var(--bone);border-radius:10px;padding:11px 14px;font:inherit;margin:8px 0}
.sep{height:1px;background:var(--line);margin:8px 0}
#ytWrap{position:fixed;right:16px;bottom:108px;width:200px;height:222px;display:flex;flex-direction:column;border-radius:14px;overflow:hidden;z-index:25;box-shadow:0 14px 40px rgba(0,0,0,.6);visibility:hidden;opacity:0;transition:opacity .3s;background:#000}
#ytWrap.on{visibility:visible;opacity:1}
#ytWrap iframe{width:100%;height:200px;flex:none;display:block}
#ytHandle{height:22px;flex:none;background:#241f33;display:grid;place-items:center;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
#ytHandle i{width:38px;height:4px;border-radius:9px;background:#7a7196}
#ytWrap.drag{box-shadow:0 20px 50px rgba(0,0,0,.75)}
#ytWrap.drag #ytHandle{cursor:grabbing}
.banner{background:var(--plum2);border-radius:14px;padding:12px 16px;margin-top:22px;color:var(--mute);max-width:640px}
.sh{margin-top:28px}
#toast{position:fixed;left:50%;bottom:110px;transform:translate(-50%,20px);background:var(--bone);color:var(--ink);padding:11px 20px;border-radius:99px;font-weight:600;opacity:0;pointer-events:none;transition:.3s;z-index:40;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.tabs{display:none}

@media (max-width:860px){
  #app{grid-template-columns:1fr;grid-template-rows:1fr auto 60px}
  aside.side{display:none}
  main{grid-column:1}
  .player{grid-row:2;grid-template-columns:1fr auto;height:70px;padding:0 12px;gap:8px}
  .pc{display:contents}
  .pc .seekrow,.pr,.ctrls .hide-m{display:none}
  .pl .mini{width:46px;height:46px}
  .player .ctrls{grid-column:2}
  .tabs{display:flex;grid-row:3;background:var(--plum);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  .tabs .nav{flex-direction:column;gap:2px;font-size:11px;justify-content:center;padding:6px;text-align:center;border-radius:0;background:none}
  .tabs .nav .ic{width:22px;height:22px}
  .row{grid-template-columns:26px 44px minmax(0,1fr) 34px 36px}
  .row .g,.row .d{display:none}
  #np{grid-template-columns:1fr;padding-top:70px;align-content:start}
  #qp{bottom:130px}
  #toast{bottom:150px}
  #ytWrap{top:64px;right:8px;bottom:auto}
  .bar{grid-template-columns:96px 1fr 40px}
}
.player{position:relative}
.mprog{display:none}
.row.on .n{font-size:0}
.row.on .n::before{content:"";display:inline-block;width:16px;height:14px;background:linear-gradient(var(--acc),var(--acc)) 0 100%/3px 100% no-repeat,linear-gradient(var(--acc),var(--acc)) 6px 100%/3px 100% no-repeat,linear-gradient(var(--acc),var(--acc)) 12px 100%/3px 100% no-repeat;animation:eq 1s infinite ease-in-out}
body.paused .row.on .n::before{animation-play-state:paused}
@keyframes eq{0%,100%{background-size:3px 30%,3px 90%,3px 50%}50%{background-size:3px 100%,3px 40%,3px 80%}}
@media (max-width:860px){.mprog{display:block;position:absolute;left:0;top:0;height:2px;width:var(--mp,0%);background:var(--acc);transition:width .3s linear}}
#pocket{position:fixed;inset:0;z-index:50;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:14px;padding:24px 24px calc(40px + env(safe-area-inset-bottom));text-align:center;touch-action:none}
#pocket[hidden]{display:none}
.pk-top b{display:block;font:800 20px var(--display);color:#bbb}
.pk-top span{color:#666}
.pk-hint{color:#555;font-size:13px;max-width:34ch}
.pk-btn{position:relative;overflow:hidden;padding:14px 28px;border-radius:99px;border:1px solid #333;color:#aaa;font-weight:600;min-width:210px;touch-action:none;user-select:none;-webkit-user-select:none}
.pk-btn i{position:absolute;left:0;top:0;bottom:0;width:0;background:#333;transition:width 0s}
.pk-btn.hold i{width:100%;transition:width .8s linear}
.pk-btn span{position:relative}
body.pocket{overflow:hidden}
body.pocket #ytWrap{left:50%!important;right:auto!important;top:22%!important;bottom:auto!important;transform:translateX(-50%);z-index:60;pointer-events:none}
.arow{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:26px 22px;margin-top:22px}
.arow.h{grid-auto-flow:column;grid-auto-columns:120px;grid-template-columns:none;overflow-x:auto;gap:18px;margin-top:0;padding-bottom:8px}
.artist{text-align:center;cursor:pointer;position:relative;min-width:0}
.avatar{width:100%;aspect-ratio:1;border-radius:50%;background-size:cover;background-position:center;display:grid;place-items:center;font:800 34px var(--display);color:rgba(255,255,255,.85);box-shadow:0 10px 28px rgba(0,0,0,.4);transition:transform .2s}
.artist:hover .avatar{transform:scale(1.04)}
.artist b{display:block;margin-top:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.artist .x{position:absolute;top:0;right:6px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;font-size:16px;line-height:28px;opacity:0;transition:opacity .15s;z-index:2}
.artist:hover .x,.artist .x:focus-visible{opacity:1}
@media (hover:none){.artist .x{opacity:.85}}
.avatar.big{width:min(200px,40vw);flex:none}
.tiles.ch{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.tiles.ch .tile{height:130px;font-size:22px}
.tile small{display:block;font:500 12.5px/1.3 var(--body);margin-top:6px;opacity:.85;position:relative;z-index:1}
#intro{position:fixed;inset:0;z-index:100;background:radial-gradient(900px 600px at 50% 36%,#2a1650 0%,#14111c 64%);overflow:hidden;transition:opacity .7s ease,transform .7s ease;animation:introFail .01s 7s forwards}
#intro.out{opacity:0;transform:scale(1.08);pointer-events:none}
@keyframes introFail{to{opacity:0;visibility:hidden;pointer-events:none}}
#introCv{position:absolute;inset:0;width:100%;height:100%}
.in-center{position:absolute;left:0;right:0;top:57%;text-align:center;padding:0 16px}
.in-word{font:800 clamp(64px,15vw,150px)/1 var(--display);letter-spacing:-.04em;display:flex;justify-content:center}
.in-word span{display:inline-block;opacity:0;transform:translateY(40px) scale(.9);filter:blur(10px);animation:inLetter .7s cubic-bezier(.2,.9,.2,1) forwards}
.in-word span:nth-child(1){animation-delay:.55s}
.in-word span:nth-child(2){animation-delay:.65s}
.in-word span:nth-child(3){animation-delay:.75s}
.in-word span:nth-child(4){animation-delay:.85s}
@keyframes inLetter{to{opacity:1;transform:none;filter:none}}
.in-hi{margin-top:16px;font:600 clamp(18px,3.4vw,28px) var(--body);color:#e9dfff;opacity:0;animation:inFade .7s 1.5s forwards}
.in-art{margin:12px auto 0;display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:center;max-width:min(92vw,640px);color:#a99ec7;font-size:14px}
.in-art span{opacity:0;animation:inFade .5s forwards}
@keyframes inFade{to{opacity:1}}

@media (prefers-reduced-motion:reduce){#intro *{animation-duration:.01s!important;animation-delay:0s!important}}

<script>
'use strict';
/* ---------- config ---------- */
const API='https://api.audius.co/v1', APP='aura_player';
const GENRES=['Electronic','Hip-Hop/Rap','Pop','Lo-Fi','Ambient','Rock','Jazz','R&B/Soul','Latin','House','Techno','Trap','Alternative','Acoustic','Folk','Funk','Reggae','Classical','Country','Metal'];
const MOODS=[['Chill','Lo-Fi'],['Focus','Ambient'],['Party','House'],['Hype','Trap'],['Late night','R&B/Soul'],['Loud','Rock']];
const DEFAULTS=['Electronic','Hip-Hop/Rap','Pop'];

/* ---------- helpers ---------- */
const $=(s,e=document)=>e.querySelector(s), $$=(s,e=document)=>[...e.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=s=>{s=Math.max(0,Math.floor(s||0));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const hue=str=>{let h=0;for(const c of String(str))h=(h*31+c.charCodeAt(0))%360;return h};
const root=document.documentElement;
const store={get(k,d){try{const v=localStorage.getItem('aura:'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('aura:'+k,JSON.stringify(v))}catch(e){}}};
const I={
 play:'<svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z" fill="currentColor"/></svg>',
 pause:'<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z" fill="currentColor"/></svg>',
 next:'<svg viewBox="0 0 24 24"><path d="M5 5l10 7-10 7zM17 5h2.4v14H17z" fill="currentColor"/></svg>',
 prev:'<svg viewBox="0 0 24 24"><path d="M19 5L9 12l10 7zM4.6 5H7v14H4.6z" fill="currentColor"/></svg>',
 shuffle:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h4l10 10h4M3 17h4l3-3M14 10l3-3h4M18 4l3 3-3 3M18 14l3 3-3 3"/></svg>',
 repeat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11V9a3 3 0 013-3h12l-3-3M20 13v2a3 3 0 01-3 3H5l3 3"/></svg>',
 heart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 20s-7.5-4.6-7.5-10.2A4.2 4.2 0 0112 7.4a4.2 4.2 0 017.5 2.4C19.500 15.400 12 20 12 20z"/></svg>',
 heartF:'<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 20s-7.5-4.6-7.5-10.2A4.2 4.2 0 0112 7.4a4.2 4.2 0 017.5 2.4C19.500 15.400 12 20 12 20z"/></svg>',
 more:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>',
 queue:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h13M3 12h13M3 18h8M18 14v6l4-3z"/></svg>',
 vol:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9zM16.500 8.500a5 5 0 010 7"/></svg>',
 home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg>',
 search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.500"/><path d="M16 16l4.500 4.500"/></svg>',
 library:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 4v16M10 4v16M15 6l4 14"/></svg>',
 insights:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20v-7M12 20V4M19 20v-10"/></svg>',
 expand:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>',
 down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
 moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>',
 user:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/></svg>',
 trophy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 01-10 0zM17 5h3v2a3 3 0 01-3 3M7 5H4v2a3 3 0 003 3"/></svg>'
};
const toastEl=$('#toast');let toastT;
function toast(m){toastEl.textContent=m;toastEl.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>toastEl.classList.remove('on'),2600)}

/* ---------- state ---------- */
const S=Object.assign({likes:[],pls:[],recent:[],seen:[],taste:{genres:{},artists:{},moods:{}},stats:{plays:0,sec:0,skips:0},events:0},store.get('state',{}));
const save=()=>store.set('state',S);
const TR=new Map();   // id -> track
const LISTS={};       // key -> array of tracks
[...S.likes,...S.recent,...S.pls.flatMap(p=>p.tracks)].forEach(t=>TR.set(t.id,t));
const liked=id=>S.likes.some(t=>t.id===id);

/* ---------- api ---------- */
const cache=new Map();
async function api(path){
  if(cache.has(path))return cache.get(path);
  const r=await fetch(API+path+(path.includes('?')?'&':'?')+'app_name='+APP);
  if(!r.ok)throw new Error('HTTP '+r.status);
  const j=await r.json();cache.set(path,j.data);return j.data;
}
const norm=t=>{
  const o={id:t.id,title:t.title||'Untitled',artist:(t.user&&t.user.name)||'Unknown artist',genre:t.genre||'Other',mood:t.mood||'',dur:t.duration||0,art:(t.artwork&&(t.artwork['480x480']||t.artwork['150x150']))||'',plays:t.play_count||0,src:'audius'};
  TR.set(o.id,Object.assign(TR.get(o.id)||{},o));return TR.get(o.id);
};
const okTrack=t=>t&&t.id&&t.is_streamable!==false&&!t.is_delete;
const trending=(g,limit=24,time='week')=>api('/tracks/trending?time='+time+'&limit='+limit+(g?'&genre='+encodeURIComponent(g):'')).then(a=>a.filter(okTrack).map(norm));
const search=(q,limit=24)=>api('/tracks/search?query='+encodeURIComponent(q)+'&limit='+limit).then(a=>a.filter(okTrack).map(norm));

const COUNTRY='IN'; // iTunes store region. Change to 'US', 'GB' etc. if you like.
function jsonp(url){return new Promise((res,rej)=>{const cb='_j'+Date.now()+Math.floor(Math.random()*1e4);const sc=document.createElement('script');window[cb]=d=>{res(d);sc.remove();delete window[cb]};sc.onerror=()=>{rej(new Error('jsonp'));sc.remove()};sc.src=url+'&callback='+cb;document.head.appendChild(sc)})}
const normI=x=>{
  const o={id:'i'+x.trackId,title:x.trackName||'Untitled',artist:x.artistName||'Unknown artist',genre:x.primaryGenreName||'Other',mood:'',dur:30,art:(x.artworkUrl100||'').replace('100x100bb','600x600bb'),plays:0,src:'itunes',url:x.previewUrl,full:Math.round((x.trackTimeMillis||0)/1000)};
  TR.set(o.id,Object.assign(TR.get(o.id)||{},o));return TR.get(o.id);
};
async function itunes(q,limit=30){
  const url='https://itunes.apple.com/search?media=music&entity=song&limit='+limit+'&country='+COUNTRY+'&term='+encodeURIComponent(q);
  let j;try{const r=await fetch(url);if(!r.ok)throw new Error('http');j=await r.json()}catch(e){j=await jsonp(url)}
  return (j.results||[]).filter(x=>x.previewUrl).map(normI);
}

/* ---------- taste + recommendations ---------- */
function bump(t,w){
  const T=S.taste;
  T.genres[t.genre]=(T.genres[t.genre]||0)+w;
  T.artists[t.artist]=(T.artists[t.artist]||0)+w;
  if(t.mood)T.moods[t.mood]=(T.moods[t.mood]||0)+w;
  if(++S.events%25===0)for(const k of ['genres','artists','moods'])for(const x in T[k])T[k][x]*=.9;
}
const topKeys=(o,n)=>Object.entries(o).filter(e=>e[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,n).map(e=>e[0]);
const hasTaste=()=>topKeys(S.taste.genres,1).length>0;

async function recommend(){
  const T=S.taste,tg=topKeys(T.genres,3),ta=topKeys(T.artists,2);
  const base=tg.length?tg:DEFAULTS;
  const unexplored=GENRES.filter(g=>!(T.genres[g]>0));
  const wild=unexplored[Math.floor(Math.random()*unexplored.length)];
  const jobs=[
    ...base.map(g=>trending(g,30).catch(()=>[])),
    ...ta.map(a=>search(a,15).catch(()=>[])),
    wild?trending(wild,12).catch(()=>[]):Promise.resolve([])
  ];
  const res=await Promise.all(jobs);
  const wildSet=new Set((res[res.length-1]||[]).map(t=>t.id));
  const seen=new Set(S.seen.slice(-200)),uniq=new Map();
  const gmax=Math.max(1,...Object.values(T.genres)),amax=Math.max(1,...Object.values(T.artists));
  for(const t of res.flat()){
    if(seen.has(t.id)||uniq.has(t.id))continue;
    const gw=(T.genres[t.genre]||0)/gmax,aw=(T.artists[t.artist]||0)/amax;
    if(aw<-.3||gw<-.5)continue;
    let score=2*gw+3*aw+.4*Math.min(1,Math.log10(t.plays+1)/6)+Math.random()*.5;
    let why;
    if(!hasTaste())why='Trending in '+t.genre;
    else if(aw>.3)why='Because you like '+t.artist;
    else if(wildSet.has(t.id)){why='Something new: '+t.genre;score+=.3}
    else if(gw>.3)why='Matches your '+t.genre+' taste';
    else why='Fresh in '+t.genre;
    uniq.set(t.id,{t,score,why});
  }
  const per={},out=[];
  for(const x of [...uniq.values()].sort((a,b)=>b.score-a.score)){
    per[x.t.artist]=(per[x.t.artist]||0)+1;
    if(per[x.t.artist]>2)continue;
    out.push(Object.assign(x.t,{why:x.why}));
    if(out.length>=30)break;
  }
  return out;
}

/* ---------- player ---------- */
const au=$('#audio');
let Q=[],qi=-1,cur=null,shuffle=false,rep=0,started=false,counted=false,eng='au',yt=null,ytReady=false,ytTimer=null,ytWarned=false,lazyPos=null,resumeAt=0,matchToast=false;
au.volume=store.get('vol',.8);$$('.vol').forEach(v=>{v.value=au.volume*100;setP(v)});
function setP(inp){inp.style.setProperty('--p',(inp.value/inp.max*100)+'%')}
const ytKey=()=>store.get('ytkey','');
const curTime=()=>eng==='yt'&&ytReady&&yt.getCurrentTime?yt.getCurrentTime():au.currentTime;
const curDur=()=>{const d=eng==='yt'&&ytReady&&yt.getDuration?yt.getDuration():au.duration;return (d&&isFinite(d)?d:0)||(cur&&cur.dur)||0};
const isPaused=()=>eng==='yt'?!(ytReady&&yt.getPlayerState&&yt.getPlayerState()===1):au.paused;
function seekTo(x){if(eng==='yt'&&ytReady)yt.seekTo(x,true);else au.currentTime=x}
function pauseAll(){au.pause();if(ytReady)try{yt.pauseVideo()}catch(e){}}
function stopYT(){clearInterval(ytTimer);if(ytReady)try{yt.stopVideo()}catch(e){}$('#ytWrap').classList.remove('on')}
function ytInit(){
  return new Promise((res,rej)=>{
    if(ytReady)return res();
    window.onYouTubeIframeAPIReady=()=>{
      yt=new YT.Player('ytp',{width:200,height:200,playerVars:{playsinline:1,controls:1,rel:0,fs:0},events:{
        onReady:()=>{ytReady=true;yt.setVolume(au.volume*100);res()},
        onStateChange:e=>{if(e.data===0&&eng==='yt')next(true);playState()},
        onError:()=>{toast('That song can\u2019t play in full. Skipping.');started=false;setTimeout(()=>next(),500)}}});
    };
    const sc=document.createElement('script');sc.src='https://www.youtube.com/iframe_api';sc.onerror=()=>rej(new Error('yt script'));document.head.appendChild(sc);
  });
}
const ytCache=new Map();
async function ytResolve(t){
  if(ytCache.has(t.id))return ytCache.get(t.id);
  const r=await fetch('https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoEmbeddable=true&videoCategoryId=10&maxResults=1&q='+encodeURIComponent(t.artist+' '+t.title+' audio')+'&key='+encodeURIComponent(ytKey()));
  if(!r.ok)throw new Error('yt '+r.status);
  const j=await r.json(),v=(j.items&&j.items[0]&&j.items[0].id&&j.items[0].id.videoId)||null;
  ytCache.set(t.id,v);return v;
}
function logEnd(){
  if(!cur||!started)return;
  const c=curTime()||0,dur=curDur()||cur.dur||1,pct=Math.min(1,c/dur);
  const w=pct>.8?3:pct>.4?1:pct<.15?-1.5:0;
  S.stats.sec+=c;
  if(pct<.15)S.stats.skips++;
  if(w)bump(cur,w);
  started=false;save();
}
function play(list,i){
  if(!list||!list[i])return;
  logEnd();Q=list.slice();qi=i;load();
}
const matchCache=new Map();
const nrm=s=>String(s||'').toLowerCase().replace(/\(.*?\)|\[.*?\]/g,' ').replace(/\b(feat|ft)\b\.?.*$/,' ').replace(/[^\p{L}\p{N}]+/gu,' ').trim();
const BADV=/\b(remix|cover|slowed|reverb|sped|speed|nightcore|bootleg|mashup|edit|flip|instrumental|karaoke|lofi|lo-fi|acoustic|live)\b/i;
async function audiusMatch(t){
  if(matchCache.has(t.id))return matchCache.get(t.id);
  let m=null;
  try{
    const list=await search(t.title.replace(/\(.*?\)/g,' ').trim()+' '+t.artist.split(/[,&]/)[0].trim(),10);
    const bt=nrm(t.title),arts=t.artist.toLowerCase().split(/[,&]|\bfeat\.?\b|\bft\.?\b/).map(x=>x.trim()).filter(x=>x.length>=3);
    m=list.find(c=>{
      if(nrm(c.title)!==bt)return false;
      if(BADV.test(c.title)&&!BADV.test(t.title))return false;
      const ca=c.artist.toLowerCase(),ct=c.title.toLowerCase();
      if(!arts.some(a=>ca.includes(a)||(ca.length>=3&&a.includes(ca))||ct.includes(a)))return false;
      if(t.full&&c.dur&&Math.abs(c.dur-t.full)/t.full>0.2)return false;
      return true;
    })||null;
  }catch(e){}
  matchCache.set(t.id,m);return m;
}
async function load(){
  const t=cur=Q[qi];if(!t)return;
  const startAt=resumeAt;resumeAt=0;lazyPos=null;
  started=true;counted=false;updateUI();
  stopYT();au.pause();
  let srcUrl=null;
  if(t.src==='itunes'&&store.get('prefAudius',true)){
    const m=await audiusMatch(t);
    if(cur!==t)return;
    if(m){
      t.alt=m;t.dur=m.dur||t.dur;srcUrl=API+'/tracks/'+m.id+'/stream?app_name='+APP;
      t.why='Full version on Audius. Keeps playing with the screen off.';updateUI();
      if(!matchToast){matchToast=true;toast('Full version found on Audius')}
    }
  }
  if(!srcUrl&&t.src==='itunes'&&ytKey()){
    try{
      const vid=await ytResolve(t);
      if(cur!==t)return;
      if(vid){
        await ytInit();if(cur!==t)return;
        eng='yt';$('#ytWrap').classList.add('on');
        if(!store.get('ytHint',false)){store.set('ytHint',true);toast('Drag the bar on the video to move it')}
        yt.loadVideoById(vid,startAt);yt.setVolume(au.volume*100);
        clearInterval(ytTimer);ytTimer=setInterval(tick,300);playState();return;
      }
    }catch(e){if(!ytWarned){ytWarned=true;toast('YouTube lookup failed. Playing the 30s preview.')}}
  }

  if('mediaSession' in navigator&&navigator.mediaSession.setPositionState&&d&&isFinite(d)&&Math.floor(c)!==tick._s){tick._s=Math.floor(c);try{navigator.mediaSession.setPositionState({duration:d,position:Math.min(c,d),playbackRate:1})}catch(e){}}

sheet.addEventListener('click',e=>{

document.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase();
  if(e.key==='Escape'){closeSheet();openNP(false);$('#qp').classList.remove('open');return}
  if(tag==='input'&&e.target.type!=='range')return;
  if(e.target.classList&&e.target.classList.contains('card')&&(e.key==='Enter')){e.target.click();return}
  if(e.code==='Space'&&tag!=='button'){e.preventDefault();toggle()}
  else if(e.key==='ArrowRight'&&e.shiftKey)next();
  else if(e.key==='ArrowLeft'&&e.shiftKey)prev();
  else if(e.key==='l'&&cur)toggleLike(cur);
});

/* ---------- session, background, install ---------- */
function saveSession(){
  if(!cur)return;
  const i=Q.indexOf(cur),st=Math.max(0,i-5),arr=Q.slice(st,st+60);
  store.set('session',{Q:arr,qi:Math.max(0,i-st),pos:lazyPos!==null?lazyPos:(curTime()||0)});
}
(function(){
  const ss=store.get('session',null);
  if(ss&&ss.Q&&ss.Q[ss.qi]){
    Q=ss.Q;qi=ss.qi;cur=Q[qi];lazyPos=ss.pos||0;updateUI();
    const d=cur.full||cur.dur||0;
    $$('.tcur').forEach(e=>e.textContent=fmt(lazyPos));$$('.tdur').forEach(e=>e.textContent=fmt(d));
    $$('.seek').forEach(x=>{x.value=d?lazyPos/d*1000:0;setP(x)});
  }
  window.addEventListener('pagehide',saveSession);
  let was=false;
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden){was=!isPaused();saveSession()}
    else if(was&&eng==='yt'&&ytReady&&isPaused()){try{yt.playVideo()}catch(e){}}
  });
  setInterval(()=>{if(cur&&!isPaused())saveSession()},5000);
  const np=$('#np');let y0=null,dy=0;
  np.addEventListener('touchstart',e=>{if(np.scrollTop<=0&&!e.target.closest('input')){y0=e.touches[0].clientY;dy=0}},{passive:true});
  np.addEventListener('touchmove',e=>{if(y0===null)return;dy=e.touches[0].clientY-y0;if(dy>0){np.style.transition='none';np.style.transform='translateY('+dy+'px)'}},{passive:true});
  np.addEventListener('touchend',()=>{if(y0===null)return;np.style.transition='';np.style.transform='';if(dy>120)openNP(false);y0=null;dy=0});
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();

/* ---------- pocket mode ---------- */
let wl=null,pocketOn=false;
async function lockScreen(){
  if(!('wakeLock' in navigator))return false;
  try{wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null});return true}catch(e){return false}
}
async function pocket(on){
  if(on){
    const ok=await lockScreen();
    if(!ok){toast('This browser can\u2019t keep the screen on. Use Chrome on Android or Safari 16.4+.');return}
    pocketOn=true;document.body.classList.add('pocket');$('#pocket').hidden=false;
    openNP(false);$('#qp').classList.remove('open');
  }else{
    pocketOn=false;document.body.classList.remove('pocket');$('#pocket').hidden=true;
    if(wl){try{wl.release()}catch(e){}wl=null}
  }
}
$('#bPocket').addEventListener('click',()=>{if(!cur){toast('Play a song first');return}pocket(true)});
(function(){
  const b=$('#pkUnlock');let tm=null;
  const stop=()=>{clearTimeout(tm);b.classList.remove('hold')};
  b.addEventListener('pointerdown',e=>{e.preventDefault();b.classList.add('hold');tm=setTimeout(()=>{b.classList.remove('hold');pocket(false)},800)});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,stop));
})();
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&pocketOn&&!wl)lockScreen()});
icons(document);

/* ---------- intro ---------- */
const nameSheet=()=>'<h3>What should Aura call you?</h3><input id="nm" placeholder="Your name" maxlength="30" value="'+esc(store.get('name','Gaurav'))+'" aria-label="Your name"><button class="cta" data-act="namesave">Save</button>';
(function(){
  const el=$('#intro');if(!el)return;
  const reduce=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
  const nm=store.get('name','Gaurav');
  $('#inHi').textContent=greet()+(nm?', '+nm:'');
  $('#inArt').innerHTML=favArtists().slice(0,5).map((a,i)=>'<span style="animation-delay:'+(1.8+i*.25)+'s">'+esc(a)+'</span>').join('');
  const cv=$('#introCv'),g=cv.getContext&&cv.getContext('2d');
  let W=0,H=0;
  const fit=()=>{if(!g)return;const d=Math.min(2,window.devicePixelRatio||1);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*d;cv.height=H*d;g.setTransform(d,0,0,d,0,0)};
  fit();window.addEventListener('resize',fit);
  const DUR=reduce?1300:3900,N=72,t0=performance.now();
  let raf=0,done=false;
  function frame(now){
    if(done)return;
    const t=(now-t0)/1000,T=DUR/1000;
    if(g){
      g.clearRect(0,0,W,H);
      const cx=W/2,cy=H*.33,R=Math.min(W*.2,H*.12);
      const inn=Math.min(1,t/.7),env=inn*(t>T-.7?Math.max(0,(T-t)/.7):1),ease=1-Math.pow(1-inn,3);
      const gl=g.createRadialGradient(cx,cy,R*.2,cx,cy,R*2.8);
      gl.addColorStop(0,'hsla(275,95%,65%,'+(.4*env)+')');gl.addColorStop(1,'hsla(275,95%,65%,0)');
      g.fillStyle=gl;g.fillRect(0,0,W,H);
      g.lineCap='round';g.lineWidth=Math.max(2,R*.045);
      for(let i=0;i<N;i++){
        const a=i/N*Math.PI*2-Math.PI/2;
        const amp=(.2+.8*Math.abs(Math.sin(t*2.6+i*.42)*Math.sin(t*1.7+i*.17)))*env;
        const r1=R*1.14,r2=r1+R*.8*amp;
        g.strokeStyle='hsl('+(265+i/N*120)+' 90% '+(58+amp*14)+'%)';
        g.beginPath();g.moveTo(cx+Math.cos(a)*r1,cy+Math.sin(a)*r1);g.lineTo(cx+Math.cos(a)*r2,cy+Math.sin(a)*r2);g.stroke();
      }
      const rr=R*(1+.05*Math.sin(t*5.2))*(.15+.85*ease);
      const og=g.createLinearGradient(cx-rr,cy-rr,cx+rr,cy+rr);og.addColorStop(0,'#be5cff');og.addColorStop(1,'#ff8a4c');
      g.fillStyle=og;g.beginPath();g.arc(cx,cy,rr,0,Math.PI*2);g.fill();
      const hl=g.createRadialGradient(cx-rr*.35,cy-rr*.4,0,cx-rr*.35,cy-rr*.4,rr*.8);
      hl.addColorStop(0,'rgba(255,255,255,.45)');hl.addColorStop(1,'rgba(255,255,255,0)');
      g.fillStyle=hl;g.beginPath();g.arc(cx,cy,rr,0,Math.PI*2);g.fill();
    }
    raf=requestAnimationFrame(frame);
  }
  function finish(){
    if(done)return;done=true;cancelAnimationFrame(raf);
    el.classList.add('out');setTimeout(()=>el.remove(),800);
  }
  el.addEventListener('click',finish);
  document.addEventListener('keydown',finish,{once:true});
  setTimeout(finish,DUR);
  raf=requestAnimationFrame(frame);
})();

/* ---------- movable video window ---------- */
(function(){
  const wrap=$('#ytWrap'),h=$('#ytHandle');
  let sx=0,sy=0,ox=0,oy=0,drag=false;
  function apply(x,y){
    const W=window.innerWidth,H=window.innerHeight,w=wrap.offsetWidth||200,hh=wrap.offsetHeight||222;
    x=Math.max(4,Math.min(W-w-4,x));y=Math.max(4,Math.min(H-hh-4,y));
    wrap.style.left=x+'px';wrap.style.top=y+'px';wrap.style.right='auto';wrap.style.bottom='auto';
  }
  h.addEventListener('pointerdown',e=>{
    drag=true;const r=wrap.getBoundingClientRect();ox=r.left;oy=r.top;sx=e.clientX;sy=e.clientY;
    try{h.setPointerCapture(e.pointerId)}catch(x){}
    wrap.classList.add('drag');e.preventDefault();
  });
  h.addEventListener('pointermove',e=>{if(drag)apply(ox+e.clientX-sx,oy+e.clientY-sy)});
  const end=()=>{
    if(!drag)return;drag=false;wrap.classList.remove('drag');
    const r=wrap.getBoundingClientRect();
    store.set('ytpos',{x:r.left/window.innerWidth,y:r.top/window.innerHeight});
  };
  h.addEventListener('pointerup',end);h.addEventListener('pointercancel',end);
  h.addEventListener('dblclick',()=>{store.set('ytpos',null);wrap.style.left=wrap.style.top=wrap.style.right=wrap.style.bottom='';toast('Video window reset')});
  function restore(){const p=store.get('ytpos',null);if(p&&typeof p.x==='number')apply(p.x*window.innerWidth,p.y*window.innerHeight)}
  restore();window.addEventListener('resize',restore);
})();
</script>
